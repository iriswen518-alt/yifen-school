<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3d52"/>
      <stop offset="100%" stop-color="#1a3a2e"/>
    </linearGradient>
  </defs>

  <!-- 背景圓角正方形 -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- 貓耳 左 -->
  <path d="M100 230 L68 120 L190 195 Z" stroke="rgba(255,255,255,0.9)" stroke-width="10" stroke-linejoin="round" fill="rgba(255,255,255,0.08)"/>
  <!-- 貓耳 右 -->
  <path d="M412 230 L444 120 L322 195 Z" stroke="rgba(255,255,255,0.9)" stroke-width="10" stroke-linejoin="round" fill="rgba(255,255,255,0.08)"/>

  <!-- 貓臉圓形 -->
  <circle cx="256" cy="300" r="185" stroke="rgba(255,255,255,0.85)" stroke-width="9" fill="rgba(255,255,255,0.04)"/>

  <!-- 左眼（杏仁） -->
  <path d="M148 278 Q186 235 224 278 Q186 318 148 278 Z" stroke="white" stroke-width="8" fill="rgba(255,255,255,0.88)"/>
  <ellipse cx="186" cy="278" rx="16" ry="23" fill="#0d2030"/>
  <circle cx="195" cy="267" r="6.5" fill="white"/>

  <!-- 右眼（杏仁） -->
  <path d="M288 278 Q326 235 364 278 Q326 318 288 278 Z" stroke="white" stroke-width="8" fill="rgba(255,255,255,0.88)"/>
  <ellipse cx="326" cy="278" rx="16" ry="23" fill="#0d2030"/>
  <circle cx="335" cy="267" r="6.5" fill="white"/>

  <!-- 鼻子 -->
  <path d="M240 338 L256 360 L272 338 Z" fill="rgba(255,155,145,0.95)"/>
  <!-- 嘴 -->
  <path d="M234 360 Q256 388 278 360" stroke="rgba(255,255,255,0.45)" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- 鬍鬚 左 -->
  <line x1="30" y1="315" x2="186" y2="328" stroke="rgba(255,255,255,0.38)" stroke-width="5" stroke-linecap="round"/>
  <line x1="30" y1="348" x2="186" y2="348" stroke="rgba(255,255,255,0.38)" stroke-width="5" stroke-linecap="round"/>
  <!-- 鬍鬚 右 -->
  <line x1="326" y1="328" x2="482" y2="315" stroke="rgba(255,255,255,0.38)" stroke-width="5" stroke-linecap="round"/>
  <line x1="326" y1="348" x2="482" y2="348" stroke="rgba(255,255,255,0.38)" stroke-width="5" stroke-linecap="round"/>
</svg>
