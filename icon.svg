<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3d52"/>
      <stop offset="100%" stop-color="#1a3a2e"/>
    </linearGradient>
  </defs>

  <!-- 背景圓角正方形 -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- 貓耳 左 -->
  <path d="M118 248 L88 155 L194 215 Z" stroke="rgba(255,255,255,0.9)" stroke-width="10" stroke-linejoin="round" fill="rgba(255,255,255,0.08)"/>
  <!-- 貓耳 右 -->
  <path d="M394 248 L424 155 L318 215 Z" stroke="rgba(255,255,255,0.9)" stroke-width="10" stroke-linejoin="round" fill="rgba(255,255,255,0.08)"/>

  <!-- 貓臉圓形 -->
  <circle cx="256" cy="330" r="168" stroke="rgba(255,255,255,0.85)" stroke-width="9" fill="rgba(255,255,255,0.04)"/>

  <!-- 左眼（杏仁） -->
  <path d="M164 315 Q196 278 228 315 Q196 350 164 315 Z" stroke="white" stroke-width="7" fill="rgba(255,255,255,0.88)"/>
  <ellipse cx="196" cy="315" rx="14" ry="20" fill="#0d2030"/>
  <circle cx="203" cy="306" r="5.5" fill="white"/>

  <!-- 右眼（杏仁） -->
  <path d="M284 315 Q316 278 348 315 Q316 350 284 315 Z" stroke="white" stroke-width="7" fill="rgba(255,255,255,0.88)"/>
  <ellipse cx="316" cy="315" rx="14" ry="20" fill="#0d2030"/>
  <circle cx="323" cy="306" r="5.5" fill="white"/>

  <!-- 鼻子 -->
  <path d="M242 362 L256 382 L270 362 Z" fill="rgba(255,155,145,0.95)"/>
  <!-- 嘴 -->
  <path d="M238 382 Q256 402 274 382" stroke="rgba(255,255,255,0.45)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- 鬍鬚 左 -->
  <line x1="50" y1="352" x2="186" y2="363" stroke="rgba(255,255,255,0.38)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="376" x2="186" y2="376" stroke="rgba(255,255,255,0.38)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 鬍鬚 右 -->
  <line x1="326" y1="363" x2="462" y2="352" stroke="rgba(255,255,255,0.38)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="326" y1="376" x2="462" y2="376" stroke="rgba(255,255,255,0.38)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 芬 字 疊在貓臉上方 -->
  <text x="256" y="210" font-family="Georgia, 'Times New Roman', serif"
        font-size="172" font-weight="700"
        fill="white" fill-opacity="0.95"
        text-anchor="middle" dominant-baseline="middle"
        letter-spacing="2">芬</text>
</svg>
